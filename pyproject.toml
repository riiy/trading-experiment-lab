[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-experiment-lab"
version = "0.1.0"
description = "Research framework for a small stock Trading Experiment account."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
qlib = [
  "pyqlib>=0.9.0",
]
akshare = [
  "akshare>=1.16.0",
]

[project.scripts]
texperiment = "texperiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
